<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2D0000">
    <meta name="description" content="Page not found — Stackly SaaS platform.">
    <title>404 Page Not Found — Stackly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="global.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .error-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 80px;
            text-align: center;
        }

        .error-inner {
            max-width: 600px;
        }

        .error-code {
            font-family: var(--display);
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 800;
            line-height: 1;
            color: var(--red);
            margin-bottom: 20px;
            letter-spacing: -.05em;
        }

        .error-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 16px;
        }

        .error-desc {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 36px;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body class="error-page">
    <main class="error-content">
        <div class="error-inner">
            <div class="error-code">404</div>
            <h1 class="display error-title">Destination unavailable</h1>
            <p class="error-desc">The page or resource you are looking for is not part of this platform view or has been moved.</p>
            <div class="error-actions">
                <a class="btn btn--solid" href="index.html">Return to Home</a>
                <button class="btn btn--ghost" onclick="history.back()">Go back</button>
            </div>
        </div>
    </main>
</body>

</html>
